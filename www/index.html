    <body>
        <header id="bar">
            <span id="name"></span>
            <span id="pageTitle"></span>
            <span id="clock"></span>
            <span
                id="dots"
                aria-hidden="true"
            ></span>
            <button
                id="lockButton"
                type="button"
                hidden
                aria-label="Lock"
            >
                <svg viewBox="0 0 24 24">

                        id="lockIcon"
                        d=""
                    />
                </svg>
            </button>

                title=""
            ></span>

            id="keypad"
            hidden
        >

                    class="padLock"
                    viewBox="0 0 24 24"
                >

                        id="padLockIcon"
                        d=""
                    />
                </svg>
                <div id="stars"></div>
                <div id="padMessage"></div>
                <div class="keys"></div>
            </div>
        </div>
